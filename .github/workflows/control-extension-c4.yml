name: Post-publication C4 controlled-attraction audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/control_extension/c4/**"
      - "results/post_publication/control_extension/c4/**"
      - "docs/post_publication/C4_CONTROLLED_ATTRACTION_MILESTONE.md"
      - ".github/workflows/control-extension-c4.yml"

jobs:
  c4-control-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formal dependencies
        run: python -m pip install -r requirements-formal.txt
      - name: Compile post-publication C4 sources
        run: python -m compileall -q research/control_extension/c4
      - name: Recompute C4-D0 sampled preflight
        run: |
          python research/control_extension/c4/c4_d0_product_chart_residence_preflight_v1_0.py \
            --report /tmp/c4_d0.json
      - name: Recompute C4-D1 Arb certificate
        run: |
          python research/control_extension/c4/c4_d1_arb_product_tube_residence_v1_0.py \
            --report /tmp/c4_d1.json
      - name: Verify semantic gates
        run: |
          python research/control_extension/c4/verify_c4_control_extension.py \
            --d0 /tmp/c4_d0.json --d1 /tmp/c4_d1.json \
            --e2a results/post_publication/control_extension/c4/c4_e2a_arb_multichart_overlap_chain_v1_0.json
      - name: Validate frozen C4-E2a JSON
        run: |
          python -m json.tool \
            results/post_publication/control_extension/c4/c4_e2a_arb_multichart_overlap_chain_v1_0.json \
            >/dev/null
          python -m unittest discover -s tests -v
      - name: Optionally recompute C4-E2a Arb overlap chain
        run: |
          python - <<'PY'
          import importlib.util
          if not importlib.util.find_spec("flint"):
              print("python-flint unavailable; skipping optional C4-E2a Arb rerun")
              raise SystemExit(0)
          PY
          cd research/control_extension/c4
          python c4_e2a_arb_multichart_overlap_chain_v1_0.py \
            --report /tmp/c4_e2a.json
          python - <<'PY'
          import json
          from pathlib import Path
          frozen = json.loads(Path(
              "../../../results/post_publication/control_extension/c4/"
              "c4_e2a_arb_multichart_overlap_chain_v1_0.json"
          ).read_text())
          rerun = json.loads(Path("/tmp/c4_e2a.json").read_text())
          keys = ["summary", "gates", "all_gates_pass", "scientific_status",
                  "claim_boundary", "required_next_step"]
          for key in keys:
              if rerun[key] != frozen[key]:
                  raise SystemExit(f"C4-E2a rerun mismatch for {key}")
          print("C4-E2a optional Arb rerun matches frozen claim-bearing fields")
          PY
