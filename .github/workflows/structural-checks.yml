name: structural-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m compileall -q rebuild_all_artifacts.py scripts tools
      - name: Verify release structure
        run: python tools/verify_release.py
