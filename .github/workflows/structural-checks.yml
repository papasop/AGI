name: structural-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile frozen source
        run: python -m compileall -q src tools scripts reproduce research
      - name: Verify frozen release hashes and metadata
        run: python tools/verify_release.py
      - name: Verify frozen prospective Principle R protocol
        run: python research/realizability_r1_r7/verify_frozen_protocol.py
      - name: Verify prospective Principle R R7 certificate
        run: python research/realizability_r1_r7/verify_r7_certificate.py --mutation-tests
      - name: Rebuild prospective R5 auxiliary candidate data
        run: python research/realizability_r1_r7/prepare_r5_full_tube_auxiliary.py --check
      - name: Verify prospective R5 auxiliary candidate data
        run: python research/realizability_r1_r7/verify_r5_full_tube_auxiliary.py --mutation-tests
      - name: Verify prospective R5 full-tube protocol
        run: python research/realizability_r1_r7/verify_r5_full_tube_protocol.py --mutation-tests
      - name: Test public verification entrypoint
        run: python scripts/verify_reference_results.py
      - name: Test published paper entrypoint
        run: python reproduce/published_paper.py
      - name: Run external repository audit
        run: python audit/audit_repo.py --strict
      - name: Install audit test dependency
        run: python -m pip install pytest==8.4.1
      - name: Run audit tests
        run: python -m pytest tests/audit
      - name: Verify complete release manifest
        run: sha256sum -c SHA256SUMS.txt
